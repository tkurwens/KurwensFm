<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurwens FM</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .player-container {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            width: 320px;
        }
        #album-art {
            width: 200px;
            height: 200px;
            border-radius: 10px;
            object-fit: cover;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            background-color: #333;
        }
        h2 { margin: 10px 0 5px 0; font-size: 20px; color: #1db954; }
        .artist { color: #ffffff; font-size: 16px; margin: 0 0 5px 0; font-weight: bold; }
        .meta-text { color: #888888; font-size: 13px; margin: 0 0 25px 0; font-style: italic; }
        .play-btn {
            background-color: #1db954;
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
        }
        .play-btn:hover { background-color: #1ed760; transform: scale(1.05); }
    </style>
</head>
<body>

<div class="player-container">
    <!-- Ładne fabryczne tło retro, dopóki nie pobierze się okładka z pliku -->
    <img id="album-art" src="https://unsplash.com" alt="Okładka">
    
    <h2 id="song-title">Kurwens FM</h2>
    <p class="artist" id="artist-name">Stacja Online</p>
    <p class="meta-text" id="song-meta">Album: ... | Rok: ...</p>
    
    <button class="play-btn" id="play-pause">ODTWÓRZ</button>
</div>

<script>
    // PEŁNY, POPRAWNY I ZABEZPIECZONY LINK DO TWOJEGO RADIA
    const RADIO_STREAM = "https://allorigins.win/raw?url=" + encodeURIComponent("https://uk23freenew.listen2myradio.com/live.mp3?typeportmount=s1_37783_stream_442779599");

    let audioCtx, source, processor;
    let isPlaying = false;
    const playBtn = document.getElementById('play-pause');

    playBtn.addEventListener('click', async () => {
        if (!isPlaying) {
            startStream();
            playBtn.innerText = "ZATRZYMAJ";
            isPlaying = true;
        } else {
            stopStream();
            playBtn.innerText = "ODTWÓRZ";
            isPlaying = false;
        }
    });

    async function startStream() {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        try {
            const response = await fetch(RADIO_STREAM, {
                headers: { 'Icy-MetaData': '1' } 
            });
            
            const metaInt = parseInt(response.headers.get('icy-metaint')) || 16000;
            const reader = response.body.getReader();
            
            processor = audioCtx.createScriptProcessor(4096, 0, 2);
            processor.connect(audioCtx.destination);

            while (isPlaying) {
                const { done, value } = await reader.read();
                if (done) break;
                parseByteArray(value, metaInt);
            }
        } catch (e) {
            console.log("Oczekiwanie na połączenie ze strumieniem ICY...");
        }
    }

    function parseByteArray(bytes, metaInt) {
        let textDecoder = new TextDecoder('utf-8');
        let rawText = textDecoder.decode(bytes);

        // Wyciąganie Tytułu i Wykonawcy z bajtów piosenki w locie
        if (rawText.includes("StreamTitle='")) {
            let songData = rawText.split("StreamTitle='")[1].split("';")[0];
            if (songData.includes("-")) {
                let parts = songData.split('-');
                document.getElementById('artist-name').innerText = parts[0].trim();
                document.getElementById('song-title').innerText = parts[1].trim();
            }
        }
        
        // Wyciąganie Twojego autorskiego tagu ALBUMU zaszytego w pliku MP3
        if (rawText.includes("StreamAlbum='")) {
            let album = rawText.split("StreamAlbum='")[1].split("';")[0];
            document.getElementById('song-meta').innerText = `Album: ${album}`;
        }
        
        // Wyciąganie Twojego autorskiego tagu ROKU zaszytego w pliku MP3
        if (rawText.includes("StreamYear='")) {
            let year = rawText.split("StreamYear='")[1].split("';")[0];
            let currentMeta = document.getElementById('song-meta').innerText;
            document.getElementById('song-meta').innerText = currentMeta + ` | Rok: ${year}`;
        }
    }

    function stopStream() {
        if (audioCtx) audioCtx.close();
        isPlaying = false;
    }
</script>

</body>
</html>
