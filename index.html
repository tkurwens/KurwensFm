<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kurwens FM</title>

<style>
body {
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#121212;
    color:white;
    font-family:Arial;
}

.player {
    background:#1e1e1e;
    padding:25px;
    border-radius:15px;
    width:320px;
    text-align:center;
}

#cover {
    width:200px;
    height:200px;
    border-radius:10px;
    object-fit:cover;
    background:#333;
}

h2 { margin:10px 0 5px; color:#1db954; }
p { margin:4px 0; color:#ccc; }

button {
    margin-top:15px;
    padding:10px 25px;
    border:none;
    border-radius:20px;
    background:#1db954;
    color:white;
    font-weight:bold;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="player">

    <img id="cover" src="https://via.placeholder.com/300" />

    <h2 id="title">Loading...</h2>
    <p id="artist">---</p>
    <p id="album">Album: ---</p>
    <p id="year">Rok: ---</p>

    <button id="btn">PLAY</button>

    <audio id="radio"></audio>

</div>

<script>
/* ================= STREAM ================= */
const STREAM =
"https://uk23freenew.listen2myradio.com/live.mp3?typeportmount=s1_37783_stream_442779599";

const audio = document.getElementById("radio");
audio.src = STREAM;

const btn = document.getElementById("btn");

let playing = false;

/* ================= PLAY / STOP ================= */
btn.onclick = async () => {
    if(!playing){
        await audio.play();
        startMetadata();
        btn.innerText = "STOP";
        playing = true;
    } else {
        audio.pause();
        btn.innerText = "PLAY";
        playing = false;
    }
};

/* ================= ICY METADATA ================= */
async function startMetadata(){

    try{
        const res = await fetch(STREAM, {
            headers: { "Icy-MetaData": "1" }
        });

        const metaInt = parseInt(res.headers.get("icy-metaint")) || 16000;
        const reader = res.body.getReader();

        let count = 0;
        let buffer = new Uint8Array();

        while(playing){
            const { value, done } = await reader.read();
            if(done) break;

            count += value.length;

            buffer = value;

            if(count >= metaInt){
                const text = new TextDecoder().decode(buffer);
                parseMetadata(text);
                count = 0;
            }
        }

    } catch(e){
        console.log("Metadata error:", e);
    }
}

/* ================= PARSE STREAM TITLE ================= */
function parseMetadata(data){

    if(!data.includes("StreamTitle='")) return;

    const raw = data.split("StreamTitle='")[1].split("';")[0];

    let artist = "Unknown";
    let title = raw;

    if(raw.includes("-")){
        [artist, title] = raw.split("-");
    }

    document.getElementById("artist").innerText = artist.trim();
    document.getElementById("title").innerText = title.trim();

    /* Album / rok – tylko jeśli serwer to wysyła */
    document.getElementById("album").innerText = "Album: ---";
    document.getElementById("year").innerText = "Rok: ---";

    loadCover(artist.trim(), title.trim());
}

/* ================= COVER (Last.fm fallback) ================= */
function loadCover(artist, title){

    const query = encodeURIComponent(artist + " " + title);

    fetch(`https://itunes.apple.com/search?term=${query}&limit=1`)
    .then(r => r.json())
    .then(data => {

        if(data.results && data.results[0]){
            document.getElementById("cover").src =
                data.results[0].artworkUrl100.replace("100x100", "300x300");
        }

    })
    .catch(()=>{});
}
</script>

</body>
</html>
