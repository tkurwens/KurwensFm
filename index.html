<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Radio</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#121212;
    color:white;
    font-family:Arial;
}

.box{
    text-align:center;
    background:#1e1e1e;
    padding:20px;
    border-radius:15px;
    width:300px;
}

img{
    width:200px;
    height:200px;
    border-radius:10px;
    background:#333;
}

h2{color:#1db954;}
</style>
</head>

<body>

<div class="box">

    <img id="cover">
    <h2 id="title">Loading...</h2>
    <p id="artist">---</p>

    <button onclick="start()">PLAY</button>

    <audio id="audio" crossorigin="anonymous"></audio>

</div>

<script>

const STREAM =
"https://uk23freenew.listen2myradio.com/live.mp3?typeportmount=s1_37783_stream_442779599";

const audio = document.getElementById("audio");
audio.src = STREAM;

let last = "";

function start(){
    audio.play();
    readMetadata();
}

/* ================= ICY REAL READER ================= */
async function readMetadata(){

    const ctx = new AudioContext();
    const src = ctx.createMediaElementSource(audio);
    src.connect(ctx.destination);

    const reader = await fetch(STREAM, {
        headers: { "Icy-MetaData": "1" }
    }).catch(()=>null);

    if(!reader || !reader.body) return;

    const stream = reader.body.getReader();

    let buffer = new Uint8Array();

    while(true){

        const { value, done } = await stream.read();
        if(done) break;

        buffer = value;

        const text = new TextDecoder().decode(buffer);

        if(text.includes("StreamTitle='")){

            const raw = text.split("StreamTitle='")[1].split("';")[0];

            if(raw === last) continue;
            last = raw;

            let artist = "Unknown";
            let title = raw;

            if(raw.includes("-")){
                [artist, title] = raw.split("-");
            }

            document.getElementById("artist").innerText = artist.trim();
            document.getElementById("title").innerText = title.trim();

            loadCover(artist, title);
        }
    }
}

/* ================= COVER ================= */
function loadCover(a,t){

    fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(a+" "+t)}&limit=1`)
    .then(r=>r.json())
    .then(d=>{

        if(d.results && d.results[0]){
            document.getElementById("cover").src =
                d.results[0].artworkUrl100.replace("100x100","300x300");
        }

    });

}

</script>

</body>
</html>
