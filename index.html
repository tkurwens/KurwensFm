<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kurwens FM</title>

<style>
body {
    background:#121212;
    color:white;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.player {
    background:#1e1e1e;
    padding:25px;
    border-radius:15px;
    width:320px;
    text-align:center;
}

#album-art {
    width:200px;
    height:200px;
    border-radius:10px;
    background:#333;
    object-fit:cover;
}

button {
    margin-top:15px;
    padding:10px 25px;
    border:none;
    border-radius:20px;
    background:#1db954;
    color:white;
    font-weight:bold;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="player">

    <img id="album-art" src="https://picsum.photos/300" />

    <h2 id="song-title">Kurwens FM</h2>
    <p id="artist">Stacja Online</p>
    <p id="meta">Album: - | Rok: -</p>

    <button id="btn">ODTWÓRZ</button>

    <audio id="radio" crossorigin="anonymous"></audio>

</div>

<script>
const STREAM_URL =
"https://uk23freenew.listen2myradio.com/live.mp3?typeportmount=s1_37783_stream_442779599";

const audio = document.getElementById("radio");
const btn = document.getElementById("btn");

audio.src = STREAM_URL;

let playing = false;

// --- PLAY / STOP ---
btn.onclick = async () => {
    if (!playing) {
        await audio.play();
        startICY();
        btn.innerText = "STOP";
        playing = true;
    } else {
        audio.pause();
        btn.innerText = "ODTWÓRZ";
        playing = false;
    }
};

// --- ICY METADATA PARSER ---
async function startICY() {
    try {
        const res = await fetch(STREAM_URL, {
            headers: { "Icy-MetaData": "1" }
        });

        const metaInt = parseInt(res.headers.get("icy-metaint")) || 16000;
        const reader = res.body.getReader();

        let buffer = new Uint8Array(0);
        let bytes = 0;

        while (playing) {
            const { value, done } = await reader.read();
            if (done) break;

            let chunk = new Uint8Array(value);
            bytes += chunk.length;

            buffer = chunk;

            // ICY metadata pojawia się co metaInt bajtów
            if (bytes >= metaInt) {
                const text = new TextDecoder().decode(buffer);

                parseICY(text);

                bytes = 0;
            }
        }
    } catch (e) {
        console.log("ICY error:", e);
    }
}

// --- PARSOWANIE METADANYCH ---
function parseICY(data) {
    if (!data.includes("StreamTitle='")) return;

    let title = data.split("StreamTitle='")[1].split("';")[0];

    if (title.includes("-")) {
        let [artist, song] = title.split("-");
        document.getElementById("artist").innerText = artist.trim();
        document.getElementById("song-title").innerText = song.trim();
    } else {
        document.getElementById("song-title").innerText = title;
    }

    // ❗ album i rok NIE są standardem ICY
    // więc zostają tylko jeśli Twój serwer je faktycznie wysyła
}
</script>

</body>
</html>
