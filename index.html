<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kurwens FM</title>

<style>
body {
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#121212;
    color:white;
    font-family:Arial;
}

.player {
    background:#1e1e1e;
    padding:25px;
    border-radius:15px;
    width:320px;
    text-align:center;
}

#cover {
    width:200px;
    height:200px;
    border-radius:10px;
    object-fit:cover;
    background:#333;
}

h2 { margin:10px 0 5px; color:#1db954; }
p { margin:4px 0; color:#ccc; }

button {
    margin-top:15px;
    padding:10px 25px;
    border:none;
    border-radius:20px;
    background:#1db954;
    color:white;
    font-weight:bold;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="player">

    <img id="cover" src="https://via.placeholder.com/300">

    <h2 id="title">Loading...</h2>
    <p id="artist">---</p>
    <p id="album">Album: ---</p>
    <p id="year">Rok: ---</p>

    <button id="btn">PLAY</button>

    <audio id="radio"></audio>

</div>

<script>

/* ================= STREAM ================= */
const STREAM =
"https://uk23freenew.listen2myradio.com/live.mp3?typeportmount=s1_37783_stream_442779599";

const audio = document.getElementById("radio");
audio.src = STREAM;

const btn = document.getElementById("btn");

let playing = false;
let lastTrack = "";

/* ================= PLAY ================= */
btn.onclick = async () => {
    if(!playing){
        try {
            await audio.play();
        } catch(e){
            console.log("Autoplay blocked", e);
        }

        startPollingMetadata();
        btn.innerText = "STOP";
        playing = true;
    } else {
        audio.pause();
        btn.innerText = "PLAY";
        playing = false;
    }
};

/* ================= METADATA POLLING ================= */
function startPollingMetadata(){

    setInterval(async () => {

        if(!playing) return;

        try {
            const res = await fetch("https://uk23freenew.listen2myradio.com");
            const html = await res.text();

            const match = html.match(/StreamTitle='(.*?)'/);

            if(!match) return;

            const raw = match[1];

            let artist = "Unknown";
            let title = raw;

            if(raw.includes("-")){
                [artist, title] = raw.split("-");
            }

            artist = artist.trim();
            title = title.trim();

            const current = artist + " - " + title;

            if(current === lastTrack) return;
            lastTrack = current;

            document.getElementById("artist").innerText = artist;
            document.getElementById("title").innerText = title;

            document.getElementById("album").innerText = "Album: ---";
            document.getElementById("year").innerText = "Rok: ---";

            loadCover(artist, title);

        } catch(e){
            console.log("metadata error", e);
        }

    }, 6000);
}

/* ================= COVER ================= */
function loadCover(artist, title){

    fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(artist+" "+title)}&limit=1`)
    .then(r => r.json())
    .then(d => {

        if(d.results && d.results[0]){
            document.getElementById("cover").src =
                d.results[0].artworkUrl100.replace("100x100","300x300");
        }

    })
    .catch(()=>{});

}

</script>

</body>
</html>
