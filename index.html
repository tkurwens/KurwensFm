<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurwens FM</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .player-container {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            width: 320px;
        }
        #album-art {
            width: 200px;
            height: 200px;
            border-radius: 10px;
            object-fit: cover;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            background-color: #333;
            transition: opacity 0.3s ease;
        }
        h2 { margin: 10px 0 5px 0; font-size: 20px; color: #1db954; }
        .artist { color: #ffffff; font-size: 16px; margin: 0 0 5px 0; font-weight: bold; }
        .meta-text { color: #888888; font-size: 13px; margin: 0 0 25px 0; font-style: italic; }
        .play-btn {
            background-color: #1db954;
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
        }
        .play-btn:hover { background-color: #1ed760; transform: scale(1.05); }
    </style>
</head>
<body>

<div class="player-container">
    <img id="album-art" src="https://unsplash.com" alt="Okładka">
    
    <h2 id="song-title">Kurwens FM</h2>
    <p class="artist" id="artist-name">Stacja Online</p>
    <p class="meta-text" id="song-meta">Album: Brak danych</p>
    
    <button class="play-btn" id="play-pause">ODTWÓRZ</button>
</div>

<!-- Niewidoczny odtwarzacz audio, który stabilnie i bezbłędnie odtwarza dźwięk -->
<audio id="radio-player" crossorigin="anonymous"></audio>

<script>
    // Bezpośredni link do strumienia (bez proxy, dla stabilności odtwarzacza HTML5)
    const STREAM_URL = "https://listen2myradio.com";
    // Link proxy używany wyłącznie do bezpiecznego czytania samych metadanych tekstowych
    const META_STREAM = "https://allorigins.win" + encodeURIComponent(STREAM_URL);
    const DEFAULT_ART = "https://unsplash.com";

    const audio = document.getElementById('radio-player');
    const playBtn = document.getElementById('play-pause');
    
    let isPlaying = false;
    let currentTrack = ""; 
    let metaReader = null;

    playBtn.addEventListener('click', () => {
        if (!isPlaying) {
            audio.src = STREAM_URL;
            audio.play()
                .then(() => {
                    playBtn.innerText = "ZATRZYMAJ";
                    isPlaying = true;
                    startMetaFetch(); // Uruchomienie pobierania nazw piosenek i okładek
                })
                .catch(err => console.error("Błąd odtwarzania:", err));
        } else {
            audio.pause();
            audio.src = ""; // Reset strumienia, aby nie buforował w tle
            playBtn.innerText = "ODTWÓRZ";
            isPlaying = false;
            if (metaReader) metaReader.cancel();
        }
    });

    // Funkcja czytająca nagłówki ICY w tle bez blokowania głośników
    async function startMetaFetch() {
        try {
            const response = await fetch(META_STREAM, { headers: { 'Icy-MetaData': '1' } });
            const metaInt = parseInt(response.headers.get('icy-metaint')) || 16000;
            metaReader = response.body.getReader();
            
            let textDecoder = new TextDecoder('utf-8');

            while (isPlaying) {
                const { done, value } = await metaReader.read();
                if (done) break;
                
                let rawText = textDecoder.decode(value);

                if (rawText.includes("StreamTitle='")) {
                    let parts = rawText.split("StreamTitle='");
                    if (parts.length > 1) {
                        let songData = parts[1].split("';")[0];
                        
                        if (songData && songData !== currentTrack) {
                            currentTrack = songData;
                            
                            if (songData.includes("-")) {
                                let trackParts = songData.split('-');
                                let artist = trackParts[0].trim();
                                let title = trackParts[1].trim();
                                
                                document.getElementById('artist-name').innerText = artist;
                                document.getElementById('song-title').innerText = title;
                                
                                fetchCoverArt(artist, title);
                            }
                        }
                    }
                }
            }
        } catch (e) {
            console.log("Wyszukiwanie metadanych...");
        }
    }

    // Pobieranie okładek w locie z bazy iTunes
    async function fetchCoverArt(artist, title) {
        let query = encodeURIComponent(`${artist} ${title}`);
        let url = `https://apple.com{query}&media=music&limit=1`;

        try {
            let res = await fetch(url);
            let data = await res.json();

            if (data.results && data.results.length > 0) {
                let track = data.results[0];
                let highResCover = track.artworkUrl100.replace("100x100bb", "300x300bb");
                
                document.getElementById('album-art').src = highResCover;
                document.getElementById('song-meta').innerText = `Album: ${track.collectionName || 'Brak danych'}`;
            } else {
                document.getElementById('album-art').src = DEFAULT_ART;
                document.getElementById('song-meta').innerText = "Album: Nieznany";
            }
        } catch (error) {
            document.getElementById('album-art').src = DEFAULT_ART;
        }
    }
</script>

</body>
</html>
