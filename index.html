<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Radio</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#121212;
    color:white;
    font-family:Arial;
}

.box{
    text-align:center;
    background:#1e1e1e;
    padding:20px;
    border-radius:15px;
    width:300px;
}

img{
    width:200px;
    height:200px;
    border-radius:10px;
    background:#333;
}

h2{color:#1db954;}
</style>
</head>

<body>

<div class="box">

    <img id="cover">
    <h2 id="title">Loading...</h2>
    <p id="artist">---</p>

    <button onclick="start()">PLAY</button>

    <audio id="audio" crossorigin="anonymous"></audio>

</div>

<script>

const STREAM =
"https://uk23freenew.listen2myradio.com/live.mp3?typeportmount=s1_37783_stream_442779599";

const audio = document.getElementById("radio");
audio.src = STREAM;

let playing = false;
let last = "";

const JSON_URL = "https://github.com/tkurwens/KurwensFm/blob/main/nowplaying.json";

document.getElementById("btn").onclick = async () => {

    if(!playing){
        audio.play();
        startJSON();
        playing = true;
        document.getElementById("btn").innerText = "STOP";
    } else {
        audio.pause();
        playing = false;
        document.getElementById("btn").innerText = "PLAY";
    }
};
    
function startJSON(){

    setInterval(async () => {

        if(!playing) return;

        try {
            const res = await fetch(JSON_URL + "?t=" + Date.now());
            const data = await res.json();

            const current = data.artist + data.title;

            if(current === last) return;
            last = current;

            document.getElementById("artist").innerText = data.artist || "---";
            document.getElementById("title").innerText = data.title || "---";
            document.getElementById("album").innerText = "Album: " + (data.album || "---");
            document.getElementById("year").innerText = "Rok: " + (data.year || "---");

            if(data.cover){
                document.getElementById("cover").src = data.cover;
            }

        } catch(e){
            console.log("JSON error", e);
        }

    }, 4000);
}


</script>

</body>
</html>
