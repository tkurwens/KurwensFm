<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #121212;
    color: white;
    font-family: Arial;
}

.player {
    background: #1e1e1e;
    padding: 25px;
    border-radius: 15px;
    width: 320px;
    text-align: center;
}

#cover {
    width: 200px;
    height: 200px;
    border-radius: 10px;
    object-fit: cover;
    background: #333;
}

button {
    margin-top: 15px;
    padding: 10px 25px;
    border: none;
    border-radius: 20px;
    background: #1db954;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #1ed760;
}
</style>
</head>

<body>

<div class="player">

    <img id="cover" src="https://via.placeholder.com/300">

    <h2 id="title">Loading...</h2>
    <p id="artist">---</p>
    <p id="album">Album: ---</p>
    <p id="year">Rok: ---</p>

    <button id="btn">PLAY</button>

    <audio id="radio" crossorigin="anonymous"></audio>

</div>

<script>

/* STREAM */
const STREAM =
"https://uk23freenew.listen2myradio.com/live.mp3?typeportmount=s1_37783_stream_442779599";

/* JSON */
const JSON_URL =
"https://raw.githubusercontent.com/tkurwens/KurwensFm/main/nowplaying.json";

const audio = document.getElementById("radio");
audio.src = STREAM;

let playing = false;
let interval = null;
let lastTrack = "";

/* ================= PLAY ================= */
document.getElementById("btn").addEventListener("click", async () => {

    try {
        audio.muted = false;
        audio.volume = 1.0;

        await audio.play();

        playing = true;
        document.getElementById("btn").innerText = "STOP";

        startMetadata();

    } catch (e) {
        console.log("PLAY ERROR:", e);
        alert("Kliknij jeszcze raz PLAY (przeglądarka mogła zablokować audio)");
    }
});

/* ================= METADATA ================= */
function startMetadata() {

    interval = setInterval(async () => {

        if (!playing) return;

        try {

            const res = await fetch(JSON_URL + "?t=" + Date.now());
            const data = await res.json();

            const current = data.artist + data.title;

            if (current === lastTrack) return;
            lastTrack = current;

            document.getElementById("artist").innerText = data.artist || "---";
            document.getElementById("title").innerText = data.title || "Loading...";
            document.getElementById("album").innerText = "Album: " + (data.album || "---");
            document.getElementById("year").innerText = "Rok: " + (data.year || "---");

            if (data.cover) {
                document.getElementById("cover").src = data.cover;
            }

        } catch (e) {
            console.log("JSON error:", e);
        }

    }, 4000);
}

</script>

</body>
</html>
